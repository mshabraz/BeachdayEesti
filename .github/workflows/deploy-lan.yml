name: Deploy to LAN

on:
  push:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy on BeachdayEestiLAN
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Log runner status
        shell: powershell
        run: |
          $logsDir = "C:\BeachdayEesti\logs"
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          $runnerSvc = Get-Service -Name "actions.runner.*" -ErrorAction SilentlyContinue | Select-Object -First 1
          $line = "[$(Get-Date -Format 'o')] runner=$($runnerSvc.Name) status=$($runnerSvc.Status) sha=${{ github.sha }}"
          Add-Content -Path "$logsDir\runner.log" -Value $line
          Write-Host $line

      - name: Verify deploy prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $taskFile = "$env:SystemRoot\System32\Tasks\BeachdayEesti-Restart"
          if (Test-Path $taskFile) {
            Write-Host "Restart helper task file present: $taskFile"
          } else {
            Write-Warning "BeachdayEesti-Restart not found. Run scripts\install-deploy-setup.ps1 as Administrator on the server."
          }
          schtasks.exe /Query /TN "BeachdayEesti-Restart" 2>&1 | Out-Null
          Write-Host "schtasks /Query exit=$LASTEXITCODE (runner may lack query rights; deploy still attempts /Run)"
          exit 0

      - name: Deploy to C:\BeachdayEesti
        shell: powershell
        run: |
          & "${{ github.workspace }}\scripts\deploy.ps1" `
            -SourcePath "${{ github.workspace }}" `
            -DeployPath "C:\BeachdayEesti" `
            -CommitSha "${{ github.sha }}" `
            -RunnerName "BeachdayEestiLAN"

      - name: Health check
        id: health
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $health = $null
          for ($i = 1; $i -le 10; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8080/health" -TimeoutSec 10
              if ($health.ok -eq $true) { break }
              Write-Host "Attempt ${i}: ok=$($health.ok)"
            } catch {
              Write-Host "Attempt ${i}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }
          if (-not $health -or $health.ok -ne $true) {
            if (Test-Path "C:\BeachdayEesti\logs\deploy.log") {
              Write-Host "--- deploy.log (tail) ---"
              Get-Content "C:\BeachdayEesti\logs\deploy.log" -Tail 15
            }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "health_ok=false"
            throw "Health check failed after retries"
          }
          $beaches = Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/beaches" -TimeoutSec 20
          $deploy = Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/deployment" -TimeoutSec 10
          Add-Content -Path $env:GITHUB_OUTPUT -Value "health_ok=true"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "beach_count=$($beaches.count)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "observation_source=$($beaches.observationSource)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "deploy_commit=$($deploy.commit)"
          Write-Host "BeachdayEesti healthy commit=$($deploy.commit) beaches=$($beaches.count)"
          Write-Host "LAN: http://192.168.1.25:8080"
          exit 0

      - name: Generate agent status brief
        if: always()
        shell: powershell
        run: |
          $deployStatus = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $healthOk = "${{ steps.health.outputs.health_ok }}"
          if (-not $healthOk) { $healthOk = "not_run" }
          & "${{ github.workspace }}\scripts\generate-agent-status.ps1" `
            -CommitSha "${{ github.sha }}" `
            -DeployStatus $deployStatus `
            -HealthOk $healthOk `
            -BeachCount ${{ steps.health.outputs.beach_count || 0 }} `
            -ObservationSource "${{ steps.health.outputs.observation_source || 'unknown' }}"

      - name: Commit agent status
        if: always()
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AGENT_STATUS.md
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No agent status changes to commit"
            exit 0
          }
          git commit -m "Update agent status after deploy [skip ci]"
          git push
